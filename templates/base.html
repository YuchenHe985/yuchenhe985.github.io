<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page_title %}{{ page_title }} · {{ site.title }}{% else %}{{ site.title }}, {{ site.tagline | lower }}{% endif %}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ site.url }}{{ path }}">
<meta property="og:type" content="{% if note is defined %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page_title or site.title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ site.url }}{{ path }}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C141E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">Yuchen He</a>
    <nav aria-label="Main">
      <a href="/#work"{% if path == "/work" %} aria-current="page"{% endif %}>Work</a>
      {% if notes %}<a href="/notes/"{% if path.startswith("/notes") %} aria-current="page"{% endif %}>Notes</a>{% endif %}
      <a href="/about/"{% if path == "/about/" %} aria-current="page"{% endif %}>About</a>
    </nav>
    <button id="theme-toggle" class="theme" type="button" aria-label="Colour theme: system">System</button>
  </div>
</header>
<main id="main">
{% block main %}{% endblock %}
</main>
<footer class="foot">
  <div class="wrap foot-inner">
    <p>© 2026 Yuchen He</p>
    <p><a href="{{ site.github }}">GitHub</a> · <a href="mailto:{{ site.email }}">Email</a></p>
    <p class="foot-note">Plain HTML and CSS, built by a short Python script. Set in Archivo, Source Serif 4 and JetBrains Mono (SIL Open Font License). Source on <a href="{{ site.github }}/yuchenhe985.github.io">GitHub</a>.</p>
  </div>
</footer>
<script src="/static/js/theme.js" defer></script>
</body>
</html>
