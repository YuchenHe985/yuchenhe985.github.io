{% extends "base.html" %}
{% block main %}
<section class="section wrap narrow-head">
  <p class="eyebrow">{{ tn.eyebrow }}</p>
  <h1 class="page-title">{{ tn.h1 }}</h1>
  <p class="lead">{{ tn.lead }}</p>
  <ol class="posts posts--page">
    {% for n in notes %}
    <li>
      <div>
        <h2><a href="{{ n.url }}">{{ n.title }}</a></h2>
        <p>{{ n.summary }}</p>
      </div>
    </li>
    {% endfor %}
  </ol>
</section>
{% endblock %}
