{% extends "base.html" %}
{% block main %}
<section class="section wrap narrow-head">
  <p class="eyebrow">Notes</p>
  <h1 class="page-title">What a measurement taught me</h1>
  <p class="lead">Short notes on one thing each. The tables, raw data and limits are in the repositories they link to.</p>
  <ol class="posts posts--page">
    {% for n in notes %}
    <li>
      <div>
        <h2><a href="{{ n.url }}">{{ n.title }}</a></h2>
        <p>{{ n.summary }}</p>
      </div>
    </li>
    {% endfor %}
  </ol>
</section>
{% endblock %}
